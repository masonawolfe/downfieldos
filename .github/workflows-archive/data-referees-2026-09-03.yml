name: Data — Referees

# Refreshes src/data/intelligence/referee_appearances.json from the nflverse
# `officials` release. Raw crew appearances only — tendency scoring (DPI rate,
# penalty yards, home/away skew) belongs in a PBP-derived workflow.

on:
  schedule:
    # Weekly Thu 12:00 UTC — the NFL announces crew assignments Wed for the
    # coming weekend; Thu refresh has them all.
    - cron: '0 12 * * 4'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-referees
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh referees
        run: npm run data:referees
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "downfieldos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/intelligence/referee_appearances.json
          if git diff --cached --quiet; then
            echo "No referee changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh referee_appearances.json from nflverse

Auto-generated by .github/workflows/data-referees.yml on schedule."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
