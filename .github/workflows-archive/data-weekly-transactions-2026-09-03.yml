name: Data — Weekly Transactions (derived)

# Diffs the nflverse weekly_rosters snapshots week-over-week to derive
# signings, releases, team changes, and status changes. Fills the gap
# CoS finding #5 flagged (no FA/waiver/cut ingest exists).
#
# This is the "cheap and reliable" alternative to a PFR wire scraper:
# lower granularity (weekly, misses intra-week churn) but stable and
# derived from the same nflverse source everything else uses.

on:
  schedule:
    # Weekly Thu 12:30 UTC — nflverse publishes weekly rosters Wed evening.
    - cron: '30 12 * * 4'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season override (blank = derived)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: data-weekly-transactions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Derive weekly transactions
        env:
          SEASON: ${{ github.event.inputs.season }}
        run: npm run data:transactions-weekly
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "downfieldos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/intelligence/weekly_transactions_*.json
          if git diff --cached --quiet; then
            echo "No weekly-transaction changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh weekly_transactions.json

Auto-generated by .github/workflows/data-weekly-transactions.yml."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
