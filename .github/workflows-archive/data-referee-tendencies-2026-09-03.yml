name: Data — Referee Tendencies

# Computes per-referee penalty tendencies (penalties/game, DPI/game,
# home-team penalty share, deltas vs league baseline) by joining
# referee_appearances.json with nflverse PBP. Runs the PBP fetch itself
# because process_pbp.py's raw dir isn't persisted between workflow runs.
#
# CoS audit 2026-08-30 finding #6 — the raw appearance feed was the
# starting point; this workflow closes the gap the fetch-referees.js
# header called out.

on:
  schedule:
    # Weekly Fri 14:00 UTC — after data-referees (Thu) has refreshed
    # the appearance file for the week.
    - cron: '0 14 * * 5'
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Data — Referees"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: data-referee-tendencies
  cancel-in-progress: false

jobs:
  compute:
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch PBP for trailing seasons
        run: |
          set -euo pipefail
          mkdir -p ../data/intelligence/raw
          for yr in 2023 2024 2025; do
            url="https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${yr}.csv.gz"
            code=$(curl -sIL --max-time 30 "$url" -o /dev/null -w "%{http_code}")
            if [ "$code" = "200" ]; then
              curl -sL --max-time 300 "$url" -o "../data/intelligence/raw/play_by_play_${yr}.csv.gz"
              echo "  ✓ ${yr}"
            else
              echo "  ⚠ ${yr}: HTTP ${code} — skipping"
            fi
          done
      - name: Compute referee tendencies
        run: SEASONS=2023,2024,2025 npm run data:referee-tendencies
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "downfieldos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/intelligence/referee_tendencies.json
          if git diff --cached --quiet; then
            echo "No referee-tendencies changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh referee_tendencies.json

Auto-generated by .github/workflows/data-referee-tendencies.yml."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
