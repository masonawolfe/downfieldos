name: Data — Injuries

# E-026 (2026-09-16): invalid YAML since 2026-08-21, fixed in a74bd2e.
# `permissions: actions: write` below is for the deploy-dispatch step.

# Refreshes src/data/intelligence/injuries_${SEASON}.json from the nflverse
# `injuries` release. Feeds a "who's out this week" surface — the raw layer
# under whatever editorial roll-up we later build.

on:
  schedule:
    # Wed 12:00 UTC year-round; NFL injury reports drop Wed/Thu/Fri in-season
    - cron: '5 5 * * 3'  # E-030 2026-09-17: overnight UTC (was `17 12`) — Wed refresh, off peak-hour backlog.
    - cron: '5 5 * * 5'  # E-030 2026-09-17: overnight UTC (was `17 12`) — Fri refresh to catch late-week designation changes.
  workflow_dispatch:
    inputs:
      season:
        description: 'Season override (blank = derived by fetch-injuries.js)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.
  issues: write  # E-043 2026-09-19: needed by the watch-dispatched-deploy composite step to open/comment the outage issue.

concurrency:
  group: data-injuries
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh injuries
        # No hard-coded season. Empty SEASON env → script derives the current
        # NFL season (rolls over on March 1). Manual overrides via
        # workflow_dispatch input still work.
        env:
          SEASON: ${{ github.event.inputs.season }}
        run: npm run data:injuries
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/intelligence/injuries_*.json
          if git diff --cached --quiet; then
            echo "No injury changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh injuries.json from nflverse

          Auto-generated by .github/workflows/data-injuries.yml on schedule."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger prevents most
          # collisions, but a manual dispatch during a push-adjacent moment
          # still races. Up to 3 attempts, each fetches origin/main and
          # rebases with --autostash before retrying. --autostash is required
          # because most refresh scripts write auxiliary files (caches, logs,
          # snap counts) beyond what `git add` staged — the first proof pass
          # tripped on this.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Record dispatch floor epoch (E-043b)
        if: steps.commit.outputs.changed == 'true'
        id: predispatch
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
      - name: Watch dispatched deploy + notify on non-success (E-043)
        if: steps.commit.outputs.changed == 'true'
        timeout-minutes: 25  # E-043b: keep the caller job from being pinned by a stuck deploy.
        uses: ./.github/actions/watch-dispatched-deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dispatched_after_epoch: ${{ steps.predispatch.outputs.at }}
