name: Data — Rosters

# Refreshes src/data/rosters${SEASON}.js from the nflverse depth-chart +
# snap-count + roster feeds. This is the workflow that would have prevented
# the five-month roster gap that caused the Aug 2026 draft coverage failures.

on:
  schedule:
    # Tue 12:00 UTC year-round (roster moves keep coming in the offseason)
    - cron: '0 12 * * 2'
    # Wed / Sat 12:00 UTC Sep–Jan (in-season churn: waivers, IR, trades)
    - cron: '0 12 * 9-12,1 3,6'
  workflow_dispatch:
    inputs:
      season:
        description: 'NFL season to refresh (nflverse depth_charts_YYYY)'
        required: false
        default: '2026'

permissions:
  contents: write

concurrency:
  group: data-rosters
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh rosters
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: npm run data:rosters
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "downfieldos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/rosters*.js
          if git diff --cached --quiet; then
            echo "No roster changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEASON="${{ github.event.inputs.season || '2026' }}"
          git commit -m "chore(data): refresh rosters${SEASON}.js from nflverse

Auto-generated by .github/workflows/data-rosters.yml on schedule."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pushes made by GITHUB_TOKEN don't fire the `push` event that
        # deploy.yml listens for, so we dispatch it explicitly.
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
