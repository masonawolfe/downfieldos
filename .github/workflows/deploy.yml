name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      # Cache the PBP JSON outputs across deploys. Completed-season PBP is
      # immutable — refetching ~300 MB on every push is pure waste (CoS
      # finding #9). GitHub caches have a natural 7-day TTL, which matches
      # the "refresh weekly during the season" cadence for the in-season
      # year. Bumping the fetch script busts the cache automatically.
      - name: Cache PBP JSON outputs
        id: pbp-cache
        uses: actions/cache@v4
        with:
          path: public/data/plays-*.json
          key: pbp-${{ hashFiles('scripts/fetch-nflverse-pbp.js') }}
      - name: Fetch real NFL play data (skipped on cache hit)
        if: steps.pbp-cache.outputs.cache-hit != 'true'
        run: npm run data:pbp
      - name: Run roster accuracy tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.homepage }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Post-deploy smoke test
        run: |
          sleep 30
          # Root must be 200 with real body.
          STATUS=$(curl -sI https://downfieldos.com/ -o /dev/null -w "%{http_code}")
          if [ "$STATUS" != "200" ]; then echo "Root returned $STATUS"; exit 1; fi
          echo "Root: $STATUS OK"
          BODY=$(curl -s https://downfieldos.com/)
          if echo "$BODY" | grep -q "DownfieldOS"; then echo "Root title check: OK"; else echo "Root title check: FAILED"; exit 1; fi
          # Non-root routes: GitHub Pages serves 404.html with HTTP 404 status,
          # then React Router takes over on the client. Status will be 404 but
          # the body is the SPA HTML shell (correct behavior for the KPI —
          # users see the app; only Google indexing pays the 404 cost).
          # Test that the SPA shell IS served on the route (not a raw 404 page).
          MATCHUP_BODY=$(curl -s https://downfieldos.com/matchup-preview)
          if echo "$MATCHUP_BODY" | grep -q 'id="root"'; then
            echo "Matchup route: SPA shell served (React root present) — OK"
          else
            echo "Matchup route: SPA shell missing — FAILED"; exit 1
          fi
          THISWEEK_BODY=$(curl -s https://downfieldos.com/this-week)
          if echo "$THISWEEK_BODY" | grep -q 'id="root"'; then
            echo "ThisWeek route: SPA shell served — OK"
          else
            echo "ThisWeek route: SPA shell missing — FAILED"; exit 1
          fi
