name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      # Cache the PBP JSON outputs across deploys. Completed-season PBP is
      # immutable — refetching ~300 MB on every push is pure waste (CoS
      # finding #9). GitHub caches have a natural 7-day TTL, which matches
      # the "refresh weekly during the season" cadence for the in-season
      # year. Bumping the fetch script busts the cache automatically.
      - name: Cache PBP JSON outputs
        id: pbp-cache
        uses: actions/cache@v4
        with:
          path: public/data/plays-*.json
          key: pbp-${{ hashFiles('scripts/fetch-nflverse-pbp.js') }}
      - name: Fetch real NFL play data (skipped on cache hit)
        if: steps.pbp-cache.outputs.cache-hit != 'true'
        run: npm run data:pbp
      - name: Run roster accuracy tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.homepage }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Post-deploy smoke test
        run: |
          sleep 30
          # ── Root ──────────────────────────────────────────────────────
          STATUS=$(curl -sI https://downfieldos.com/ -o /dev/null -w "%{http_code}")
          if [ "$STATUS" != "200" ]; then echo "Root returned $STATUS"; exit 1; fi
          echo "Root: $STATUS OK"
          BODY=$(curl -s https://downfieldos.com/)
          if echo "$BODY" | grep -q "DownfieldOS"; then echo "Root title check: OK"; else echo "Root title check: FAILED"; exit 1; fi

          # ── Non-root routes — now 200 with per-route og meta (Q-001) ──
          # scripts/prerender-routes.js writes dist/<route>/index.html for
          # each route in the build. GitHub Pages serves those directly.
          # Deep links must be 200 (crawlers/unfurlers need it) AND carry
          # route-specific og:url (not the homepage URL).
          for route in matchup-preview this-week team-intel fantasy-intel war-room so-what dashboard 2026-preview; do
            RSTATUS=$(curl -sIL "https://downfieldos.com/${route}" -o /dev/null -w "%{http_code}")
            if [ "$RSTATUS" != "200" ]; then echo "/${route} returned $RSTATUS"; exit 1; fi
            RBODY=$(curl -sL "https://downfieldos.com/${route}")
            if echo "$RBODY" | grep -q "og:url\" content=\"https://downfieldos.com/${route}\""; then
              echo "/${route}: 200 OK + route-specific og:url"
            else
              echo "/${route}: og:url does not match route — Q-001 regression"; exit 1
            fi
            if echo "$RBODY" | grep -q 'id="root"'; then :; else
              echo "/${route}: SPA root div missing"; exit 1
            fi
          done

          # ── Bundle — Q-003: catch a broken build that would white-screen ──
          BUNDLE=$(echo "$BODY" | grep -oE 'src="/assets/index-[a-zA-Z0-9_-]+\.js"' | head -1 | sed -E 's/^src="//;s/"$//')
          if [ -z "$BUNDLE" ]; then echo "No JS bundle referenced in root HTML"; exit 1; fi
          BSTATUS=$(curl -sI "https://downfieldos.com${BUNDLE}" -o /dev/null -w "%{http_code}")
          if [ "$BSTATUS" != "200" ]; then echo "Bundle $BUNDLE returned $BSTATUS"; exit 1; fi
          BSIZE=$(curl -sI "https://downfieldos.com${BUNDLE}" | grep -i "^content-length:" | awk '{print $2}' | tr -d '\r')
          if [ -z "$BSIZE" ] || [ "$BSIZE" -lt 100000 ]; then
            echo "Bundle $BUNDLE size $BSIZE bytes — suspiciously small (broken build?)"; exit 1
          fi
          echo "Bundle $BUNDLE: 200 OK, ${BSIZE} bytes"
