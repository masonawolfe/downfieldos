name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Set true to run the notify path without failing the deploy (opens a [SIMULATED] issue and returns).'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write
  # E-041 (2026-09-19): needed by notify_on_failure to open/comment issues.
  # The deploy-watcher subscribed via workflow_run stopped catching failures
  # once data workflows started dispatching deploy.yml with GITHUB_TOKEN —
  # GitHub does not fan out workflow_run events for GITHUB_TOKEN-triggered
  # runs, so 6 of 6 deploys today produced 0 watcher runs. Notify inline
  # so visibility no longer depends on the fan-out.
  issues: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      # Cache the PBP JSON outputs across deploys. Completed-season PBP is
      # immutable — refetching ~300 MB on every push is pure waste (CoS
      # finding #9). GitHub caches have a natural 7-day TTL, which matches
      # the "refresh weekly during the season" cadence for the in-season
      # year. Bumping the fetch script busts the cache automatically.
      - name: Workflow YAML parse check (E-026)
        # Ubuntu runners ship Ruby with Psych. Parse every workflow file
        # with a real YAML parser and fail the deploy if any won't load.
        # An unparseable workflow file is silently registered under its
        # path with name=path, 422s on dispatch, and ghosts every push —
        # the failure mode that hid the 12 data-*-v2 files' broken
        # `git commit -m` block for nearly a month. Verify with a parser
        # before theorizing about the platform.
        run: bash scripts/check-workflows.sh
      - name: Release-surface checks (E-008)
        # Fails the build on:
        #   1. a nav line missing from PUBLIC_SURFACES
        #   2. a router <Route> missing from prerender ROUTES
        # See .github/scripts/check-release-surfaces.mjs and RELEASE_PROCESS.md.
        run: node .github/scripts/check-release-surfaces.mjs
      - name: DATA_SOURCES.md completeness gate (E-048)
        # E-048 (2026-10-01, counsel C-012): DATA_SOURCES.md listed only the
        # nflverse releases while the data and fetch scripts referenced 14
        # other external domains, several carrying attribution obligations
        # (Wikipedia is CC BY-SA 4.0). This extracts every external host
        # from src/data, scripts and public/data and fails the deploy if one
        # is not declared. Runs on the deploy path because an undeclared
        # source is a compliance gap in what we publish, not just in a
        # data refresh.
        run: npm run check:data-sources
      - name: Board freshness gate (Generated stamp < 48h)
        # BOARD.md is regenerated by data-board.yml every day (workflow_run
        # after data-availability, plus an independent 11:30 UTC cron so
        # one failed availability run cannot silently stop the board). If
        # BOARD.md is over 48h old at deploy time, something upstream is
        # wedged — fail loud instead of shipping stale data behind a
        # green "deploy succeeded". (peer QA 2026-09-16, freshness #3)
        run: |
          set -euo pipefail
          STAMP=$(grep -oE '\| Generated \| [^ ]+' BOARD.md | awk '{print $NF}')
          if [ -z "$STAMP" ]; then
            echo "BOARD.md has no Generated stamp — cannot verify freshness"
            exit 1
          fi
          BOARD_EPOCH=$(date -u -d "$STAMP" +%s 2>/dev/null || date -u -jf "%Y-%m-%dT%H:%M:%S" "${STAMP%.*}" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_H=$(( (NOW_EPOCH - BOARD_EPOCH) / 3600 ))
          MAX_H=48
          echo "BOARD.md Generated: $STAMP (age: ${AGE_H}h, ceiling: ${MAX_H}h)"
          if [ "$AGE_H" -gt "$MAX_H" ]; then
            echo "BOARD.md is stale (${AGE_H}h > ${MAX_H}h). Check data-availability and data-board runs."
            exit 1
          fi
      - name: Cache PBP JSON outputs
        id: pbp-cache
        uses: actions/cache@v4
        with:
          path: public/data/plays-*.json
          key: pbp-${{ hashFiles('scripts/fetch-nflverse-pbp.js') }}
      - name: Fetch real NFL play data (skipped on cache hit)
        if: steps.pbp-cache.outputs.cache-hit != 'true'
        run: npm run data:pbp
      - name: Run roster accuracy tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.homepage }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      # Repo needed for .github/scripts/render-smoke.mjs — build job checks
      # out its own copy, this one must do the same.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post-deploy smoke test
        run: |
          sleep 30
          # ── Root ──────────────────────────────────────────────────────
          STATUS=$(curl -sI https://downfieldos.com/ -o /dev/null -w "%{http_code}")
          if [ "$STATUS" != "200" ]; then echo "Root returned $STATUS"; exit 1; fi
          echo "Root: $STATUS OK"
          BODY=$(curl -s https://downfieldos.com/)
          if echo "$BODY" | grep -q "DownfieldOS"; then echo "Root title check: OK"; else echo "Root title check: FAILED"; exit 1; fi

          # ── Non-root routes — now 200 with per-route og meta (Q-001) ──
          # scripts/prerender-routes.js writes dist/<route>/index.html for
          # each route in the build. GitHub Pages serves those directly.
          # Deep links must be 200 (crawlers/unfurlers need it) AND carry
          # route-specific og:url (not the homepage URL).
          for route in matchup-preview this-week team-intel fantasy-intel war-room so-what dashboard 2026-preview draft-copilot admin; do
            RSTATUS=$(curl -sIL "https://downfieldos.com/${route}" -o /dev/null -w "%{http_code}")
            if [ "$RSTATUS" != "200" ]; then echo "/${route} returned $RSTATUS"; exit 1; fi
            RBODY=$(curl -sL "https://downfieldos.com/${route}")
            if echo "$RBODY" | grep -q "og:url\" content=\"https://downfieldos.com/${route}\""; then
              echo "/${route}: 200 OK + route-specific og:url"
            else
              echo "/${route}: og:url does not match route — Q-001 regression"; exit 1
            fi
            if echo "$RBODY" | grep -q 'id="root"'; then :; else
              echo "/${route}: SPA root div missing"; exit 1
            fi
          done

          # ── Bundle — Q-003: catch a broken build that would white-screen ──
          BUNDLE=$(echo "$BODY" | grep -oE 'src="/assets/index-[a-zA-Z0-9_-]+\.js"' | head -1 | sed -E 's/^src="//;s/"$//')
          if [ -z "$BUNDLE" ]; then echo "No JS bundle referenced in root HTML"; exit 1; fi
          BSTATUS=$(curl -sI "https://downfieldos.com${BUNDLE}" -o /dev/null -w "%{http_code}")
          if [ "$BSTATUS" != "200" ]; then echo "Bundle $BUNDLE returned $BSTATUS"; exit 1; fi
          # E-048 follow-on (2026-10-01): this probe read `content-length`
          # from a HEAD and treated an ABSENT header the same as a small
          # bundle — "suspiciously small (broken build?)" with an empty
          # size in the message. GitHub Pages now answers HEAD for this
          # asset with 200 and no content-length, so the gate failed every
          # deploy while the bundle was fine (6,897,496 bytes, verified by
          # GET). A gate that fails for a reason it misreports trains
          # people to ignore red, which is worse than no gate.
          #
          # Measure the bytes we actually receive. Fall back to HEAD's
          # content-length only as a cheap first try.
          BSIZE=$(curl -sI "https://downfieldos.com${BUNDLE}" | grep -i "^content-length:" | awk '{print $2}' | tr -d '\r')
          BSIZE_SRC="content-length"
          if [ -z "$BSIZE" ]; then
            BSIZE=$(curl -s --fail "https://downfieldos.com${BUNDLE}" | wc -c | tr -d ' ')
            BSIZE_SRC="GET byte count (no content-length on HEAD)"
          fi
          if [ -z "$BSIZE" ] || [ "$BSIZE" -eq 0 ]; then
            echo "Bundle $BUNDLE: could not measure size — fetch failed"; exit 1
          fi
          if [ "$BSIZE" -lt 100000 ]; then
            echo "Bundle $BUNDLE is ${BSIZE} bytes via ${BSIZE_SRC} — under the 100000 floor (broken build?)"; exit 1
          fi
          echo "Bundle $BUNDLE: 200 OK, ${BSIZE} bytes (via ${BSIZE_SRC})"

          # ── Headless render — QA 2026-09-04d P1: shell + status are not
          # evidence the page works. TDZ bugs (2026-04-25 MatchupCenter,
          # 2026-08-21 FantasyIntel) shipped green through 40+ deploys
          # because the smoke test measured the CDN, not the product.
          # Puppeteer boots each route, waits for network idle, and fails
          # on any uncaught exception or on the error-boundary text.
      - name: Headless-render each route
        run: |
          npm i -D puppeteer@23 --no-audit --no-fund
          node .github/scripts/render-smoke.mjs

  # E-041 (2026-09-19): opens or updates a GitHub issue when any deploy
  # job does not succeed. Runs inline so the notification does not depend
  # on workflow_run cascade — the standalone deploy-watcher.yml fired 15
  # times on 09-18 against workflow_dispatch shapes and 0 times on 09-19
  # against the same shape, with no repo change in between. Cause is
  # unknown; the inline job removes the dependency, so debugging why the
  # cascade stopped no longer gates outage visibility. The watcher is
  # kept as a second signal.
  #
  # Q-052 (2026-09-19 12:05 CT): originally fired on `failure` only. A
  # `cancelled` deploy (e.g. run 35142037261 for `45b3394` on 09-18,
  # cancelled by the `pages` concurrency group) notified nothing and a
  # bot data commit could sit undeployed silently. Predicate widened to
  # any-non-success — `failure`, `cancelled`, or `skipped` (a job that
  # never ran because a needed job did not succeed). Issue body now
  # names each job's result so the debugger sees which one moved.
  notify_on_failure:
    runs-on: ubuntu-latest
    needs: [build, deploy, smoke-test]
    # Fires when ANY of build/deploy/smoke-test did not end in success,
    # OR when the operator dispatched with simulate_failure=true (proof
    # path). `always()` ensures this job is scheduled even after an
    # upstream failure or cancellation.
    if: >-
      ${{ always() && (
        needs.build.result != 'success' ||
        needs.deploy.result != 'success' ||
        needs.smoke-test.result != 'success' ||
        github.event.inputs.simulate_failure == 'true'
      ) }}
    permissions:
      contents: read
      issues: write
      # E-050 (2026-10-01): needed to list sibling deploy runs for the
      # supersede check below.
      actions: read
    steps:
      - name: Open or update failure issue with SHA de-dupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          IS_SIM: ${{ github.event.inputs.simulate_failure }}
        run: |
          set -euo pipefail
          SHORT=$(echo "$SHA" | cut -c1-7)
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}"
          # Q-052: report every job's result, not just failures. Names
          # the state so a `cancelled` (concurrency group ate it) or a
          # `skipped` (a `needs:` job did not succeed) is visible in the
          # issue body without a click into the run.
          JOBS_LINE="build=${BUILD_RESULT}, deploy=${DEPLOY_RESULT}, smoke-test=${SMOKE_RESULT}"
          NOT_OK=""
          for entry in "build=${BUILD_RESULT}" "deploy=${DEPLOY_RESULT}" "smoke-test=${SMOKE_RESULT}"; do
            n="${entry%%=*}"; r="${entry#*=}"
            [ "$r" != "success" ] && NOT_OK="${NOT_OK}${n}(${r}) "
          done
          NOT_OK="${NOT_OK% }"
          [ -z "$NOT_OK" ] && NOT_OK="none"

          # ── E-050 (2026-10-01): supersede check for the cancelled class ──
          #
          # Q-052 widened this job's predicate from `== failure` to
          # `!= success` so a deploy cancelled by the `pages` concurrency
          # group would stop being silent. Correct, but it did not carry
          # over the benign-later-success logic that
          # .github/actions/watch-dispatched-deploy already had. Result:
          # every concurrency cancellation filed an issue even when the
          # very next deploy covered it — 7 such issues between 09-22 and
          # 10-01 (#6, #19, #24, #26, #43, #80, #88).
          #
          # Scope: the CANCELLED class only. A genuine `failure` still
          # alarms even if a later deploy succeeded — a broken build that
          # someone else happened to fix is still something to know about.
          # Peer's instruction was explicit on this narrowing.
          #
          # Timing, which the composite did not have to solve: that job
          # watched a run from outside and could wait. This job runs
          # INSIDE the cancelled run, and the superseding run is usually
          # still in_progress at this moment — so asking "did a later run
          # SUCCEED" is false at exactly the wrong time and files anyway.
          #
          # So the test is "does a newer deploy run exist on a same-or-
          # newer SHA", counting success AND still-deciding states. If one
          # exists, it owns the outcome: it succeeds (benign) or it fails
          # and files its OWN issue. No wait, no timeout, no gap, no
          # double-report.
          #
          # SHA ancestry via the compare API, per Q-056 — `git merge-base`
          # needs both commits locally and this job has no checkout at all.
          IS_CANCELLED_CLASS=0
          case "${BUILD_RESULT}|${DEPLOY_RESULT}|${SMOKE_RESULT}" in
            *failure*) ;;                      # a real failure is never superseded away
            *cancelled*) IS_CANCELLED_CLASS=1 ;;
          esac

          if [ "$IS_CANCELLED_CLASS" = "1" ] && [ "${IS_SIM:-false}" != "true" ]; then
            echo "  cancelled class (${JOBS_LINE}) — checking for a superseding deploy"
            SUPERSEDED_BY=""
            SUPERSEDED_SHA=""
            SUPERSEDED_STATE=""
            while IFS=$'\t' read -r id sha url status conc; do
              [ -z "$id" ] && continue
              [ "$id" -le "$RUN_ID" ] && continue          # not newer
              # A newer run counts if it succeeded, or if it is still
              # deciding (it will file its own issue if it fails).
              case "${conc:-$status}" in
                success|in_progress|queued|requested|waiting|pending|"") ;;
                *) continue ;;
              esac
              if [ -n "$sha" ] && [ "$sha" != "$SHA" ]; then
                cmp=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...${sha}" --jq '.status // ""' 2>/dev/null || echo "")
                case "$cmp" in
                  identical|ahead) ;;                      # same or newer — covers us
                  *) continue ;;                           # behind/diverged/unknown — does not
                esac
              fi
              SUPERSEDED_BY="$url"
              SUPERSEDED_SHA="$sha"
              SUPERSEDED_STATE="${conc:-$status}"
              break
            done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow=deploy.yml --limit 20 \
              --json databaseId,headSha,url,status,conclusion \
              --jq '.[] | [.databaseId, .headSha, .url, .status, .conclusion] | @tsv' 2>/dev/null || true)

            if [ -n "$SUPERSEDED_BY" ]; then
              echo "  benign: superseded by ${SUPERSEDED_BY} (state=${SUPERSEDED_STATE}, sha=$(echo "$SUPERSEDED_SHA" | cut -c1-7))"
              echo "  that run owns the outcome for this SHA — not filing an issue."
              echo "::notice::Deploy for ${SHORT} was cancelled by the pages concurrency group and superseded by ${SUPERSEDED_BY}. No issue filed (E-050)."
              exit 0
            fi
            echo "  no superseding deploy found — this cancellation left the SHA uncovered, filing."
          fi
          # ── end E-050 supersede check ──

          if [ "$IS_SIM" = "true" ]; then
            TITLE_PREFIX="[SIMULATED] "
            BODY_TAG=$'**This is an operator dry-run of the in-deploy failure notify path (E-041), not a real deploy failure.** Close after verifying.\n\n'
            # Simulate always passes the predicate even when everything succeeded;
            # tag the not_ok line so it does not read "none".
            [ "$NOT_OK" = "none" ] && NOT_OK="simulate"
          else
            TITLE_PREFIX=""
            BODY_TAG=""
          fi
          # De-dupe: search for an open issue naming the same SHA. Comment
          # instead of opening a duplicate. One incident, one issue.
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "deploy failed after commit ${SHORT} in:title" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Additional non-success on ${SHORT}: ${RUN_URL} (jobs: ${JOBS_LINE})" || echo "comment failed; falling back to annotation"
            echo "  updated open issue #${EXISTING} for ${SHORT}"
            exit 0
          fi
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "${TITLE_PREFIX}deploy failed after commit ${SHORT}" \
            --body "${BODY_TAG}**Deploy to GitHub Pages did not succeed — the site is running against the previous successful deploy until this is resolved.**

          - Run: ${RUN_URL}
          - Commit: [\`${SHORT}\`](${COMMIT_URL})
          - Jobs: ${JOBS_LINE}
          - Not-success: ${NOT_OK}

          Auto-filed by \`.github/workflows/deploy.yml\` (\`notify_on_failure\` — E-041 2026-09-19). Fires on any non-success result (\`failure\`, \`cancelled\`, or \`skipped\`) so a concurrency-group cancellation (\`pages\` group ate the run) or a downstream job that never ran because an upstream one did not succeed is still visible. Close when a later deploy succeeds; subsequent non-successes on the same commit will comment on this issue rather than opening a new one." \
            || {
              echo "gh issue create failed — falling back to workflow annotation"
              echo "::error::Deploy $RUN_URL did not succeed after commit $SHORT (jobs: $JOBS_LINE)"
              exit 0
            }
