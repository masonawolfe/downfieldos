name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Set true to run the notify path without failing the deploy (opens a [SIMULATED] issue and returns).'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write
  # E-041 (2026-09-19): needed by notify_on_failure to open/comment issues.
  # The deploy-watcher subscribed via workflow_run stopped catching failures
  # once data workflows started dispatching deploy.yml with GITHUB_TOKEN —
  # GitHub does not fan out workflow_run events for GITHUB_TOKEN-triggered
  # runs, so 6 of 6 deploys today produced 0 watcher runs. Notify inline
  # so visibility no longer depends on the fan-out.
  issues: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      # Cache the PBP JSON outputs across deploys. Completed-season PBP is
      # immutable — refetching ~300 MB on every push is pure waste (CoS
      # finding #9). GitHub caches have a natural 7-day TTL, which matches
      # the "refresh weekly during the season" cadence for the in-season
      # year. Bumping the fetch script busts the cache automatically.
      - name: Workflow YAML parse check (E-026)
        # Ubuntu runners ship Ruby with Psych. Parse every workflow file
        # with a real YAML parser and fail the deploy if any won't load.
        # An unparseable workflow file is silently registered under its
        # path with name=path, 422s on dispatch, and ghosts every push —
        # the failure mode that hid the 12 data-*-v2 files' broken
        # `git commit -m` block for nearly a month. Verify with a parser
        # before theorizing about the platform.
        run: bash scripts/check-workflows.sh
      - name: Release-surface checks (E-008)
        # Fails the build on:
        #   1. a nav line missing from PUBLIC_SURFACES
        #   2. a router <Route> missing from prerender ROUTES
        # See .github/scripts/check-release-surfaces.mjs and RELEASE_PROCESS.md.
        run: node .github/scripts/check-release-surfaces.mjs
      - name: Board freshness gate (Generated stamp < 48h)
        # BOARD.md is regenerated by data-board.yml every day (workflow_run
        # after data-availability, plus an independent 11:30 UTC cron so
        # one failed availability run cannot silently stop the board). If
        # BOARD.md is over 48h old at deploy time, something upstream is
        # wedged — fail loud instead of shipping stale data behind a
        # green "deploy succeeded". (peer QA 2026-09-16, freshness #3)
        run: |
          set -euo pipefail
          STAMP=$(grep -oE '\| Generated \| [^ ]+' BOARD.md | awk '{print $NF}')
          if [ -z "$STAMP" ]; then
            echo "BOARD.md has no Generated stamp — cannot verify freshness"
            exit 1
          fi
          BOARD_EPOCH=$(date -u -d "$STAMP" +%s 2>/dev/null || date -u -jf "%Y-%m-%dT%H:%M:%S" "${STAMP%.*}" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_H=$(( (NOW_EPOCH - BOARD_EPOCH) / 3600 ))
          MAX_H=48
          echo "BOARD.md Generated: $STAMP (age: ${AGE_H}h, ceiling: ${MAX_H}h)"
          if [ "$AGE_H" -gt "$MAX_H" ]; then
            echo "BOARD.md is stale (${AGE_H}h > ${MAX_H}h). Check data-availability and data-board runs."
            exit 1
          fi
      - name: Cache PBP JSON outputs
        id: pbp-cache
        uses: actions/cache@v4
        with:
          path: public/data/plays-*.json
          key: pbp-${{ hashFiles('scripts/fetch-nflverse-pbp.js') }}
      - name: Fetch real NFL play data (skipped on cache hit)
        if: steps.pbp-cache.outputs.cache-hit != 'true'
        run: npm run data:pbp
      - name: Run roster accuracy tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.homepage }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      # Repo needed for .github/scripts/render-smoke.mjs — build job checks
      # out its own copy, this one must do the same.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post-deploy smoke test
        run: |
          sleep 30
          # ── Root ──────────────────────────────────────────────────────
          STATUS=$(curl -sI https://downfieldos.com/ -o /dev/null -w "%{http_code}")
          if [ "$STATUS" != "200" ]; then echo "Root returned $STATUS"; exit 1; fi
          echo "Root: $STATUS OK"
          BODY=$(curl -s https://downfieldos.com/)
          if echo "$BODY" | grep -q "DownfieldOS"; then echo "Root title check: OK"; else echo "Root title check: FAILED"; exit 1; fi

          # ── Non-root routes — now 200 with per-route og meta (Q-001) ──
          # scripts/prerender-routes.js writes dist/<route>/index.html for
          # each route in the build. GitHub Pages serves those directly.
          # Deep links must be 200 (crawlers/unfurlers need it) AND carry
          # route-specific og:url (not the homepage URL).
          for route in matchup-preview this-week team-intel fantasy-intel war-room so-what dashboard 2026-preview draft-copilot admin; do
            RSTATUS=$(curl -sIL "https://downfieldos.com/${route}" -o /dev/null -w "%{http_code}")
            if [ "$RSTATUS" != "200" ]; then echo "/${route} returned $RSTATUS"; exit 1; fi
            RBODY=$(curl -sL "https://downfieldos.com/${route}")
            if echo "$RBODY" | grep -q "og:url\" content=\"https://downfieldos.com/${route}\""; then
              echo "/${route}: 200 OK + route-specific og:url"
            else
              echo "/${route}: og:url does not match route — Q-001 regression"; exit 1
            fi
            if echo "$RBODY" | grep -q 'id="root"'; then :; else
              echo "/${route}: SPA root div missing"; exit 1
            fi
          done

          # ── Bundle — Q-003: catch a broken build that would white-screen ──
          BUNDLE=$(echo "$BODY" | grep -oE 'src="/assets/index-[a-zA-Z0-9_-]+\.js"' | head -1 | sed -E 's/^src="//;s/"$//')
          if [ -z "$BUNDLE" ]; then echo "No JS bundle referenced in root HTML"; exit 1; fi
          BSTATUS=$(curl -sI "https://downfieldos.com${BUNDLE}" -o /dev/null -w "%{http_code}")
          if [ "$BSTATUS" != "200" ]; then echo "Bundle $BUNDLE returned $BSTATUS"; exit 1; fi
          BSIZE=$(curl -sI "https://downfieldos.com${BUNDLE}" | grep -i "^content-length:" | awk '{print $2}' | tr -d '\r')
          if [ -z "$BSIZE" ] || [ "$BSIZE" -lt 100000 ]; then
            echo "Bundle $BUNDLE size $BSIZE bytes — suspiciously small (broken build?)"; exit 1
          fi
          echo "Bundle $BUNDLE: 200 OK, ${BSIZE} bytes"

          # ── Headless render — QA 2026-09-04d P1: shell + status are not
          # evidence the page works. TDZ bugs (2026-04-25 MatchupCenter,
          # 2026-08-21 FantasyIntel) shipped green through 40+ deploys
          # because the smoke test measured the CDN, not the product.
          # Puppeteer boots each route, waits for network idle, and fails
          # on any uncaught exception or on the error-boundary text.
      - name: Headless-render each route
        run: |
          npm i -D puppeteer@23 --no-audit --no-fund
          node .github/scripts/render-smoke.mjs

  # E-041 (2026-09-19): opens or updates a GitHub issue when any deploy
  # job fails, with SHA-based de-dupe. Runs inline so the notification
  # does not depend on workflow_run cascade — deploy runs triggered by
  # `gh workflow run deploy.yml` from a data workflow's GITHUB_TOKEN
  # never fan out workflow_run and were silently going unnoticed by the
  # standalone deploy-watcher.yml. The watcher is kept as a second
  # signal for push-triggered / human-token deploys.
  notify_on_failure:
    runs-on: ubuntu-latest
    needs: [build, deploy, smoke-test]
    # Fires when any upstream job failed OR when the operator dispatched
    # with simulate_failure=true (proof path). `always()` ensures this
    # job is scheduled even after an upstream failure.
    if: >-
      ${{ always() && (
        needs.build.result == 'failure' ||
        needs.deploy.result == 'failure' ||
        needs.smoke-test.result == 'failure' ||
        github.event.inputs.simulate_failure == 'true'
      ) }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue with SHA de-dupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          IS_SIM: ${{ github.event.inputs.simulate_failure }}
        run: |
          set -euo pipefail
          SHORT=$(echo "$SHA" | cut -c1-7)
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}"
          FAILED=""
          [ "$BUILD_RESULT"  = "failure" ] && FAILED="${FAILED} build"
          [ "$DEPLOY_RESULT" = "failure" ] && FAILED="${FAILED} deploy"
          [ "$SMOKE_RESULT"  = "failure" ] && FAILED="${FAILED} smoke-test"
          FAILED="${FAILED## }"
          if [ "$IS_SIM" = "true" ]; then
            TITLE_PREFIX="[SIMULATED] "
            BODY_TAG=$'**This is an operator dry-run of the in-deploy failure notify path (E-041), not a real deploy failure.** Close after verifying.\n\n'
            FAILED="${FAILED:-simulate}"
          else
            TITLE_PREFIX=""
            BODY_TAG=""
          fi
          # De-dupe: search for an open issue naming the same SHA. Comment
          # instead of opening a duplicate. One incident, one issue.
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "deploy failed after commit ${SHORT} in:title" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Additional failure on ${SHORT}: ${RUN_URL} (failed: ${FAILED})" || echo "comment failed; falling back to annotation"
            echo "  updated open issue #${EXISTING} for ${SHORT}"
            exit 0
          fi
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "${TITLE_PREFIX}deploy failed after commit ${SHORT}" \
            --body "${BODY_TAG}**Deploy to GitHub Pages failed — the site is running against the previous successful deploy until this is resolved.**

          - Failed run: ${RUN_URL}
          - Commit: [\`${SHORT}\`](${COMMIT_URL})
          - Failed jobs: ${FAILED}

          Auto-filed by \`.github/workflows/deploy.yml\` (notify_on_failure job — E-041 2026-09-19). Close when a later deploy succeeds; subsequent failures on the same commit will comment on this issue rather than opening a new one." \
            || {
              echo "gh issue create failed — falling back to workflow annotation"
              echo "::error::Deploy $RUN_URL failed after commit $SHORT (failed: $FAILED)"
              exit 0
            }
