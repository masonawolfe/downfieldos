name: Data — PBP Derived (situational splits, scheme profiles)

# E-026 (2026-09-16): invalid YAML since 2026-08-21, fixed in a74bd2e.
# `permissions: actions: write` below is for the deploy-dispatch step.

# Runs the pandas-based process_pbp.py script that derives team scheme
# profiles, scheme similarity matrix, player usage data, and situational
# splits from the season's play-by-play CSV. Outputs land in
# src/data/intelligence/pbp/ for the app to consume.

on:
  schedule:
    # Weekly Tue 13:00 UTC — after the previous week's PBP CSV has been
    # rebuilt by nflverse (which happens on their Mon cadence).
    - cron: '11 6 * * 2'  # E-030 2026-09-17: overnight UTC (was `7 13`) — Tue refresh, off peak-hour backlog.
  workflow_dispatch:
    inputs:
      year:
        description: 'PBP season override (blank = derived: current NFL season since March)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.
  issues: write  # E-043 2026-09-19: needed by the watch-dispatched-deploy composite step to open/comment the outage issue.

concurrency:
  group: data-pbp-derived
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    env:
      PBP_YEAR: ${{ github.event.inputs.year }}
      PBP_OUT_DIR: ${{ github.workspace }}/src/data/intelligence/pbp
      # PBP_RAW_DIR is set in the "Derive PBP_YEAR" step via $GITHUB_ENV.
      # `${{ runner.temp }}` is a step-context expression and cannot be used
      # in the job-level env block — GHA rejects the whole file with
      # "Unrecognized named-value: 'runner'" at dispatch time. (E-026-follow-1)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: pip install --upgrade pandas
      - name: Derive PBP_YEAR when unset
        # Empty PBP_YEAR → current NFL season (rolls March 1). Falls back to
        # SEASON-1 if the current-season files don't exist yet (preseason).
        # Matches fetch-injuries.js pattern.
        run: |
          set -euo pipefail
          if [ -z "${PBP_YEAR:-}" ]; then
            m=$(date -u +%m); y=$(date -u +%Y)
            if [ "$m" -ge 3 ]; then PBP_YEAR="$y"; else PBP_YEAR=$((y-1)); fi
            echo "Derived PBP_YEAR=$PBP_YEAR"
          fi
          echo "PBP_YEAR=$PBP_YEAR" >> "$GITHUB_ENV"
          # See job env comment: PBP_RAW_DIR moved here because runner.temp
          # is a step-context expression. $RUNNER_TEMP shell var is always
          # exported on GHA runners.
          echo "PBP_RAW_DIR=$RUNNER_TEMP/pbp-raw" >> "$GITHUB_ENV"
      - name: Download nflverse PBP + roster (fall back to SEASON-1 on 404)
        run: |
          set -euo pipefail
          mkdir -p "$PBP_RAW_DIR" "$PBP_OUT_DIR"
          try_download() {
            local year="$1"
            local pbp="https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${year}.csv.gz"
            local roster="https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_${year}.csv"
            # Snap counts — required for load_snap_shares() in process_pbp.py.
            # Without this file, snap_share = None for every player and
            # downstream snap_share_adj drops for 122 players silently
            # (QA 2026-09-04c P0 pattern).
            local snaps="https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_${year}.csv"
            local http
            http=$(curl -sIL --max-time 30 "$pbp" -o /dev/null -w "%{http_code}")
            [ "$http" = "200" ] || return 1
            curl -sL --max-time 300 "$pbp" -o "$PBP_RAW_DIR/play_by_play_${year}.csv.gz"
            curl -sL --max-time 120 "$roster" -o "$PBP_RAW_DIR/roster_weekly_${year}.csv"
            # snap_counts is a smaller file; a 404 here is not fatal (the
            # PBP-derived output degrades to snap_share=None), so log and
            # continue rather than aborting the whole run.
            local snap_http
            snap_http=$(curl -sIL --max-time 30 "$snaps" -o /dev/null -w "%{http_code}")
            if [ "$snap_http" = "200" ]; then
              curl -sL --max-time 120 "$snaps" -o "$PBP_RAW_DIR/snap_counts_${year}.csv"
              echo "  ✓ snap_counts_${year}.csv downloaded"
            else
              echo "  ⚠ snap_counts_${year}.csv HTTP ${snap_http} — snap_share will be None."
            fi
            echo "PBP_YEAR=$year" >> "$GITHUB_ENV"
          }
          if ! try_download "$PBP_YEAR"; then
            fallback=$((PBP_YEAR - 1))
            echo "⚠ ${PBP_YEAR} PBP unavailable; falling back to ${fallback}"
            try_download "$fallback"
          fi
          ls -lh "$PBP_RAW_DIR"
      - name: Derive PBP intelligence
        run: python scripts/pbp/process_pbp.py --year "$PBP_YEAR"
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/intelligence/pbp/
          if git diff --cached --quiet; then
            echo "No PBP-derived changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh PBP-derived intelligence (${PBP_YEAR})

          Auto-generated by .github/workflows/data-pbp-derived.yml on schedule.
          Includes team_scheme_profiles, scheme_similarity_matrix, player_usage_data,
          situational_splits, and pbp_sync_metadata."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger prevents most
          # collisions, but a manual dispatch during a push-adjacent moment
          # still races. Up to 3 attempts, each fetches origin/main and
          # rebases with --autostash before retrying. --autostash is required
          # because most refresh scripts write auxiliary files (caches, logs,
          # snap counts) beyond what `git add` staged — the first proof pass
          # tripped on this.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Record dispatch floor epoch (E-043b)
        if: steps.commit.outputs.changed == 'true'
        id: predispatch
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
      - name: Watch dispatched deploy + notify on non-success (E-043)
        if: steps.commit.outputs.changed == 'true'
        timeout-minutes: 25  # E-043b: keep the caller job from being pinned by a stuck deploy.
        uses: ./.github/actions/watch-dispatched-deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dispatched_after_epoch: ${{ steps.predispatch.outputs.at }}
