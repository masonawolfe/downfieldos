name: Data — Former Teammates

# E-026 (2026-09-16): invalid YAML since 2026-08-21, fixed in a74bd2e.
# `permissions: actions: write` below is for the deploy-dispatch step.

# Rebuilds src/data/intelligence/former_teammates_*.json from a 5-year window
# of nflverse rosters. Feeds the "former teammates" and "revenge game" intel
# cards in MatchupCenter, plus the QB-WR reunion signal (P2-2).

on:
  schedule:
    # Monthly on the 1st, 12:00 UTC — the graph changes with team assignments;
    # once roster syncs land, one monthly rebuild is enough.
    - cron: '45 5 1 * *'  # E-030 2026-09-17: overnight UTC (was `42 12`) — monthly on the 1st, off peak-hour backlog.
  workflow_dispatch:
    inputs:
      current_season:
        description: 'Current season (players current team = latest in window)'
        required: false
        default: '2026'
      history_years:
        description: 'Trailing seasons for co-teammate detection'
        required: false
        default: '5'

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.
  issues: write  # E-043 2026-09-19: needed by the watch-dispatched-deploy composite step to open/comment the outage issue.

concurrency:
  group: data-teammates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Rebuild former-teammate graph
        env:
          CURRENT_SEASON: ${{ github.event.inputs.current_season || '2026' }}
          HISTORY_YEARS: ${{ github.event.inputs.history_years || '5' }}
        run: npm run data:fetch
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/intelligence/former_teammates_active.json src/data/intelligence/former_teammates_by_matchup.json
          if git diff --cached --quiet; then
            echo "No former-teammates changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): rebuild former-teammates graph from nflverse

          Auto-generated by .github/workflows/data-teammates.yml on schedule."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger prevents most
          # collisions, but a manual dispatch during a push-adjacent moment
          # still races. Up to 3 attempts, each fetches origin/main and
          # rebases with --autostash before retrying. --autostash is required
          # because most refresh scripts write auxiliary files (caches, logs,
          # snap counts) beyond what `git add` staged — the first proof pass
          # tripped on this.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Record dispatch floor epoch (E-043b)
        if: steps.commit.outputs.changed == 'true'
        id: predispatch
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
      - name: Watch dispatched deploy + notify on non-success (E-043)
        if: steps.commit.outputs.changed == 'true'
        timeout-minutes: 25  # E-043b: keep the caller job from being pinned by a stuck deploy.
        uses: ./.github/actions/watch-dispatched-deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dispatched_after_epoch: ${{ steps.predispatch.outputs.at }}
