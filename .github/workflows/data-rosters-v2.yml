name: Data — Rosters

# E-026 (2026-09-16): invalid YAML since 2026-08-21, fixed in a74bd2e.
# `permissions: actions: write` below is for the deploy-dispatch step.

# Refreshes src/data/rosters${SEASON}.js from the nflverse depth-chart +
# snap-count + roster feeds. This is the workflow that would have prevented
# the five-month roster gap that caused the Aug 2026 draft coverage failures.

on:
  schedule:
    # Tue 12:00 UTC year-round (roster moves keep coming in the offseason)
    - cron: '29 5 * * 2'  # E-030 2026-09-17: overnight UTC (was `32 12`) — Tue refresh, off peak-hour backlog.
    # Wed / Sat 12:00 UTC Sep–Jan (in-season churn: waivers, IR, trades)
    - cron: '29 5 * 9-12,1 3,6'  # E-030 2026-09-17: overnight UTC (was `32 12`) — seasonal Wed/Sat, off peak-hour backlog.
  workflow_dispatch:
    inputs:
      season:
        description: 'NFL season to refresh (nflverse depth_charts_YYYY)'
        required: false
        default: '2026'

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.

concurrency:
  group: data-rosters
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh rosters
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: npm run data:rosters
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/rosters*.js
          if git diff --cached --quiet; then
            echo "No roster changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEASON="${{ github.event.inputs.season || '2026' }}"
          git commit -m "chore(data): refresh rosters${SEASON}.js from nflverse

          Auto-generated by .github/workflows/data-rosters.yml on schedule."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger prevents most
          # collisions, but a manual dispatch during a push-adjacent moment
          # still races. Up to 3 attempts, each fetches origin/main and
          # rebases with --autostash before retrying. --autostash is required
          # because most refresh scripts write auxiliary files (caches, logs,
          # snap counts) beyond what `git add` staged — the first proof pass
          # tripped on this.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pushes made by GITHUB_TOKEN don't fire the `push` event that
        # deploy.yml listens for, so we dispatch it explicitly.
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
