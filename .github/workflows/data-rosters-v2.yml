name: Data — Rosters

# E-024 (2026-09-16): re-registered under the same path after GitHub's
# workflow-file parser stayed cached on the broken 2026-09-03 state and
# would not re-read the file on lighter changes. Adding an explicit
# `actions: read` permission below is the extra shape change that
# actually triggered re-parse for the 11-workflow batch. See E-015 /
# E-022 / E-024 in _TO_COS.md.

# Refreshes src/data/rosters${SEASON}.js from the nflverse depth-chart +
# snap-count + roster feeds. This is the workflow that would have prevented
# the five-month roster gap that caused the Aug 2026 draft coverage failures.

on:
  schedule:
    # Tue 12:00 UTC year-round (roster moves keep coming in the offseason)
    - cron: '32 12 * * 2'  # E-029 2026-09-16: staggered minute (was `0`) so no two data workflows start together.
    # Wed / Sat 12:00 UTC Sep–Jan (in-season churn: waivers, IR, trades)
    - cron: '32 12 * 9-12,1 3,6'  # E-029 2026-09-16: staggered minute (was `0`) so no two data workflows start together.
  workflow_dispatch:
    inputs:
      season:
        description: 'NFL season to refresh (nflverse depth_charts_YYYY)'
        required: false
        default: '2026'

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.

concurrency:
  group: data-rosters
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh rosters
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: npm run data:rosters
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/rosters*.js
          if git diff --cached --quiet; then
            echo "No roster changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEASON="${{ github.event.inputs.season || '2026' }}"
          git commit -m "chore(data): refresh rosters${SEASON}.js from nflverse

          Auto-generated by .github/workflows/data-rosters.yml on schedule."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger (see `on.schedule`
          # above) prevents most collisions, but a manual dispatch during a
          # push-adjacent moment still races. Up to 3 attempts, each fetches
          # origin/main and rebases before retrying.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pushes made by GITHUB_TOKEN don't fire the `push` event that
        # deploy.yml listens for, so we dispatch it explicitly.
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
