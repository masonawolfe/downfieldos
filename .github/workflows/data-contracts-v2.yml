name: Data — Contracts

# E-024 (2026-09-16): re-registered under the same path after GitHub's
# workflow-file parser stayed cached on the broken 2026-09-03 state and
# would not re-read the file on lighter changes. Adding an explicit
# `actions: read` permission below is the extra shape change that
# actually triggered re-parse for the 11-workflow batch. See E-015 /
# E-022 / E-024 in _TO_COS.md.

# Refreshes src/data/intelligence/contracts.json from the nflverse `contracts`
# release (OTC historical data). The nflverse snapshot is currently stale
# (last active-deal capture 2022), so this workflow runs monthly and the JSON
# self-reports its staleness_years / is_stale flag for consumers to gate on.

on:
  schedule:
    # Monthly on the 1st, 12:00 UTC
    - cron: '12 12 1 * *'  # E-029 2026-09-16: staggered minute (was `0`) so no two data workflows start together.
  workflow_dispatch:
    inputs:
      season:
        description: 'Contract-year season (deals ending this year → contract_year)'
        required: false
        default: '2026'

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.

concurrency:
  group: data-contracts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh contracts
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: npm run data:contracts
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/intelligence/contracts.json
          if git diff --cached --quiet; then
            echo "No contract changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh contracts.json from nflverse

          Auto-generated by .github/workflows/data-contracts.yml on schedule."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger (see `on.schedule`
          # above) prevents most collisions, but a manual dispatch during a
          # push-adjacent moment still races. Up to 3 attempts, each fetches
          # origin/main and rebases before retrying.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
