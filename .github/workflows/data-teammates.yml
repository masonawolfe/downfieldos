name: Data — Former Teammates

# Rebuilds src/data/intelligence/former_teammates_*.json from a 5-year window
# of nflverse rosters. Feeds the "former teammates" and "revenge game" intel
# cards in MatchupCenter, plus the QB-WR reunion signal (P2-2).

on:
  schedule:
    # Monthly on the 1st, 12:00 UTC — the graph changes with team assignments;
    # once roster syncs land, one monthly rebuild is enough.
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      current_season:
        description: 'Current season (players current team = latest in window)'
        required: false
        default: '2026'
      history_years:
        description: 'Trailing seasons for co-teammate detection'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: data-teammates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Rebuild former-teammate graph
        env:
          CURRENT_SEASON: ${{ github.event.inputs.current_season || '2026' }}
          HISTORY_YEARS: ${{ github.event.inputs.history_years || '5' }}
        run: npm run data:fetch
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "downfieldos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/intelligence/former_teammates_active.json src/data/intelligence/former_teammates_by_matchup.json
          if git diff --cached --quiet; then
            echo "No former-teammates changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): rebuild former-teammates graph from nflverse

Auto-generated by .github/workflows/data-teammates.yml on schedule."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
