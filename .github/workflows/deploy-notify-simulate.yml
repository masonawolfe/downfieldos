name: E-043 · Notify-path simulate

# Proof workflow for the caller-side watch/notify composite step
# (`.github/actions/watch-dispatched-deploy`). Dispatch it with a
# desired conclusion (cancelled / failure / skipped) and it files a
# [SIMULATED] issue via the same code path the 15 data callers use.
#
# Never runs on cron/push. This does not touch the deploy pipeline or
# any data file — it exists only to prove the notify path fires.

on:
  workflow_dispatch:
    inputs:
      conclusion:
        description: 'Which non-success outcome to simulate (cancelled | failure | skipped).'
        required: false
        default: 'cancelled'
        type: choice
        options:
          - cancelled
          - failure
          - skipped
      benign_later_sha:
        description: 'Q-056 proof hook — set to a SHA (or "HEAD") to simulate a benign cancel with a later successful deploy on this SHA. When set, overrides `conclusion` and prints which branch (benign / outage) the composite would fire. Fetches nothing, opens no issue.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Watch dispatched deploy + notify on non-success (simulate branch)
        uses: ./.github/actions/watch-dispatched-deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          simulate_conclusion: ${{ github.event.inputs.conclusion }}
          simulate_benign_later_sha: ${{ github.event.inputs.benign_later_sha }}
