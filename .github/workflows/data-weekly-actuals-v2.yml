name: Data — Weekly Actuals

# E-031 (2026-09-17): collect weekly player actuals from nflverse's
# stats_player release. Runs Wednesday overnight — after MNF closes the
# week Monday and nflverse's typical Tuesday US-time publish window.
# Data lands ~24 hours before Mason's Wednesday wake-up.
#
# Sequence, mirroring data-board.yml (QA 2026-09-17 22:05 caught this
# workflow committing calibration ungated):
#   actuals → Emit CALIBRATION.md → Verify (11-check, must pass to commit)
#           → Commit → deploy dispatch
# The verifier reads the calibration this job just wrote and asserts
# it matches the committed weekly board (check #11), so a bad table
# can never be committed here.

on:
  schedule:
    - cron: '31 6 * * 3'  # E-030 window: Wed 06:31 UTC — right after board-verify at 06:29 in the overnight stagger.
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write  # needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches.

concurrency:
  group: data-weekly-actuals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh weekly actuals
        run: npm run data:actuals
      # QA 2026-09-17 19:05: calibration must also run when new actuals land
      # (a new week of data changes every projection-vs-actual pair, not just
      # when the board changes). If it fails (assert on projected == weekly_value
      # mismatch), don't commit — the class is exactly "calibration and board
      # out of sync".
      - name: Emit CALIBRATION.md (E-032)
        run: npm run --silent data:calibration
      # QA 2026-09-17 22:05: gate the calibration commit on the same 11-check
      # verifier data-board runs. Check #11 reads the calibration just written
      # and asserts it matches the committed weekly board's weekly_value for
      # every (gsis_id, week); any drift blocks the commit. The verifier
      # doesn't rebuild the board — it grades the on-disk state — so it also
      # catches "committed board went stale relative to today's inputs"
      # (check #6 availability freshness, etc.) as a side benefit.
      - name: Verify the board (verifier gate — must pass to commit)
        id: verify
        run: |
          set -euo pipefail
          LOG=$(mktemp)
          npm run data:board:verify 2>&1 | tee "$LOG"
          COUNT=$(grep -Eo 'Task acceptance: [0-9]+/[0-9]+ checks passed' "$LOG" | tail -1 | grep -Eo '[0-9]+/[0-9]+' || true)
          if [ -z "$COUNT" ]; then COUNT="?/?"; fi
          echo "  captured verifier count: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        id: commit
        env:
          VERIFIER_COUNT: ${{ steps.verify.outputs.count }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/intelligence/weekly_actuals_2026.json
          git add CALIBRATION.md src/data/intelligence/calibration_2026.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No weekly-actuals changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh weekly_actuals_2026.json from nflverse

          All ${VERIFIER_COUNT} verifier checks passed at build time.
          Auto-generated by .github/workflows/data-weekly-actuals-v2.yml on schedule."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger prevents most
          # collisions, but a manual dispatch during a push-adjacent moment
          # still races. Up to 3 attempts, each fetches origin/main and
          # rebases with --autostash before retrying.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
