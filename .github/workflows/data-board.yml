name: Data — Player Board

# Rebuilds src/data/playerBoard2026.js by joining playerStats2025 (with
# usage/team-change/QB enrichment), roster_weekly_2026, availability, and
# schedule. Then runs the 6-check verifier INLINE as a gate — if any check
# fails, no commit and no deploy dispatch happens. That keeps a stale or
# broken board out of production.
#
# Chains after data-availability.yml so the board picks up the fresh
# availability snapshot. Also dispatchable directly.
#
# E-022 (2026-09-16): re-registered under the same path after E-015 confirmed
# the 09-03 registration was cached broken. Previous copy archived at
# `.github/workflows-archive/data-board-2026-09-03.yml`. Added `actions:
# write` so the final `gh workflow run deploy.yml` step succeeds.

on:
  workflow_run:
    workflows: ["Data — Availability"]
    types: [completed]
  workflow_dispatch:
    inputs:
      override_freeze:
        description: 'Bypass the DRAFT_WINDOW.md freeze (yes/no). Use only for emergencies.'
        required: false
        default: 'no'

permissions:
  contents: write
  actions: write

concurrency:
  group: data-board
  cancel-in-progress: false

jobs:
  build_and_verify:
    # Only proceed if the upstream availability run actually succeeded, OR
    # if a human dispatched this run manually.
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # E-009b freeze gate — aborts a board build during an active draft
      # window unless the caller passes DRAFT_FREEZE_OVERRIDE=yes. The gate
      # covers both the scheduled workflow_run entry and manual dispatches.
      # See ../../DRAFT_WINDOW.md at the DFOS ROOT.
      - name: Draft-window freeze check
        env:
          DRAFT_FREEZE_OVERRIDE: ${{ github.event.inputs.override_freeze }}
        run: node .github/scripts/check-draft-freeze.mjs
      - run: npm install
      - name: Fetch nflverse roster_weekly + team_scheme_profiles
        # E-023 (2026-09-16): the build scripts probe both
        # <repo>/data/intelligence and <parent>/data/intelligence and prefer
        # whichever exists. Mason's local runs already have the DFOS-root
        # copies of these files; CI needs them fetched into the repo path.
        # Both files are small (~1MB combined) so a per-run fetch is fine.
        run: |
          set -euo pipefail
          mkdir -p data/intelligence/raw data/intelligence/pbp
          curl -sSL --fail --max-time 120 \
            "https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_2026.csv.gz" \
            -o data/intelligence/raw/roster_weekly_2026.csv.gz
          echo "  roster_weekly_2026.csv.gz: $(wc -c < data/intelligence/raw/roster_weekly_2026.csv.gz) bytes"
      - name: Build the pre-draft board
        run: npm run data:board
      - name: Verify the board (6-check gate — must pass to commit)
        run: npm run data:board:verify
      # E-009a — emit the always-on readable table beside the JS artifact.
      # Runs AFTER the verifier so the header's "verifier" line reflects
      # this build's gate result, not a stale one. BOARD.md + BOARD_WEEKLY.md
      # land at the DFOS ROOT (one directory above `repo/`), so anyone opening
      # 01_Schuhbox/DFOS/BOARD.md sees the current table without knowing about
      # the repo. See scripts/build-board-md.mjs.
      - name: Emit BOARD.md + BOARD_WEEKLY.md (E-009a)
        run: npm run --silent data:board:md
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/playerBoard2026.js data/board_last_snapshot.json BOARD.md BOARD_WEEKLY.md
          if git diff --cached --quiet; then
            echo "No board changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh playerBoard2026.js + BOARD.md

          All 6 verifier checks passed at build time.
          Auto-generated by data-board.yml (E-009a wiring, re-registered under E-022)."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
