name: Data — Player Board

# Rebuilds src/data/playerBoard2026.js by joining playerStats2025 (with
# usage/team-change/QB enrichment), roster_weekly_2026, availability, and
# schedule. Then runs the verifier INLINE as a gate — if any check
# fails, no commit and no deploy dispatch happens. That keeps a stale or
# broken board out of production.
#
# Chains after data-availability.yml so the board picks up the fresh
# availability snapshot. Also dispatchable directly.
#
# E-022 (2026-09-16): re-registered under the same path after E-015 confirmed
# the 09-03 registration was cached broken. Previous copy archived at
# `.github/workflows-archive/data-board-2026-09-03.yml`. Added `actions:
# write` so the final `gh workflow run deploy.yml` step succeeds.

on:
  workflow_run:
    workflows: ["Data — Availability"]
    types: [completed]
  # Also run on our own daily schedule — 30 min after data-availability's
  # cron. A failed availability run must not silently stop the board from
  # refreshing; the freshness check in deploy.yml is the backstop that
  # fails loud if the Generated stamp goes stale. (peer QA 2026-09-16,
  # freshness residual #3.) E-030 2026-09-17: moved to overnight UTC to
  # avoid peak-hour scheduler backlog.
  schedule:
    - cron: '34 4 * * *'  # E-030 2026-09-17: overnight UTC (was `30 11`) — 30 min after availability's 04:04.
  workflow_dispatch:
    inputs:
      override_freeze:
        description: 'Bypass the DRAFT_WINDOW.md freeze (yes/no). Use only for emergencies.'
        required: false
        default: 'no'

permissions:
  contents: write
  actions: write
  issues: write  # E-043 2026-09-19: needed by the watch-dispatched-deploy composite step to open/comment the outage issue.

concurrency:
  group: data-board
  cancel-in-progress: false

jobs:
  build_and_verify:
    # Only proceed if the upstream availability run actually succeeded, OR
    # if a human dispatched this run manually.
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # E-009b freeze gate — aborts a board build during an active draft
      # window unless the caller passes DRAFT_FREEZE_OVERRIDE=yes. The gate
      # covers both the scheduled workflow_run entry and manual dispatches.
      # See ../../DRAFT_WINDOW.md at the DFOS ROOT.
      - name: Draft-window freeze check
        env:
          DRAFT_FREEZE_OVERRIDE: ${{ github.event.inputs.override_freeze }}
        run: node .github/scripts/check-draft-freeze.mjs
      - run: npm install
      - name: Fetch nflverse roster_weekly + team_scheme_profiles
        # E-023 (2026-09-16): the build scripts probe both
        # <repo>/data/intelligence and <parent>/data/intelligence and prefer
        # whichever exists. Mason's local runs already have the DFOS-root
        # copies of these files; CI needs them fetched into the repo path.
        # Both files are small (~1MB combined) so a per-run fetch is fine.
        run: |
          set -euo pipefail
          mkdir -p data/intelligence/raw data/intelligence/pbp
          curl -sSL --fail --max-time 120 \
            "https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_2026.csv.gz" \
            -o data/intelligence/raw/roster_weekly_2026.csv.gz
          echo "  roster_weekly_2026.csv.gz: $(wc -c < data/intelligence/raw/roster_weekly_2026.csv.gz) bytes"
      - name: Build the pre-draft board
        run: npm run data:board
      # QA 2026-09-17 21:05 caught the ordering trap: calibration must be
      # regenerated BEFORE the verifier runs, so verifier check #11 grades
      # the calibration that is about to ship in this commit — not the
      # previous commit's file against the current weekly board. Sequence:
      # build → emit calibration → verify (11-check) → emit BOARD.md → commit.
      - name: Emit CALIBRATION.md (E-032)
        run: |
          if [ -f src/data/intelligence/weekly_actuals_2026.json ]; then
            npm run --silent data:calibration
          else
            echo "  no weekly_actuals_2026.json yet — skipping calibration."
          fi
      - name: Verify the board (verifier gate — must pass to commit)
        id: verify
        # Q-022 2026-09-17: capture the passed/total count from the last
        # "Task acceptance: N/M checks passed" line and expose it as a step
        # output so the commit message and any downstream can read the true
        # number instead of a hardcoded literal.
        run: |
          set -euo pipefail
          LOG=$(mktemp)
          npm run data:board:verify 2>&1 | tee "$LOG"
          COUNT=$(grep -Eo 'Task acceptance: [0-9]+/[0-9]+ checks passed' "$LOG" | tail -1 | grep -Eo '[0-9]+/[0-9]+' || true)
          if [ -z "$COUNT" ]; then COUNT="?/?"; fi
          echo "  captured verifier count: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      # E-009a — emit the always-on readable table beside the JS artifact.
      # Runs AFTER the verifier so the header's "verifier" line reflects
      # this build's gate result, not a stale one. BOARD.md + BOARD_WEEKLY.md
      # land at the DFOS ROOT (one directory above `repo/`), so anyone opening
      # 01_Schuhbox/DFOS/BOARD.md sees the current table without knowing about
      # the repo. See scripts/build-board-md.mjs.
      - name: Emit BOARD.md + BOARD_WEEKLY.md (E-009a)
        run: npm run --silent data:board:md
      - name: Commit if changed
        id: commit
        env:
          VERIFIER_COUNT: ${{ steps.verify.outputs.count }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage board artifacts + calibration outputs (safe if the calibration
          # step wrote nothing new — `git add` on missing files skips them).
          git add src/data/playerBoard2026.js data/board_last_snapshot.json BOARD.md BOARD_WEEKLY.md
          git add CALIBRATION.md src/data/intelligence/calibration_2026.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No board changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh playerBoard2026.js + BOARD.md

          All ${VERIFIER_COUNT} verifier checks passed at build time.
          Auto-generated by data-board.yml (E-009a wiring, re-registered under E-022)."
          # E-029 retry-with-rebase for cron minute collisions.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Record dispatch floor epoch (E-043b)
        if: steps.commit.outputs.changed == 'true'
        id: predispatch
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
      - name: Watch dispatched deploy + notify on non-success (E-043)
        if: steps.commit.outputs.changed == 'true'
        timeout-minutes: 25  # E-043b: keep the caller job from being pinned by a stuck deploy.
        uses: ./.github/actions/watch-dispatched-deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dispatched_after_epoch: ${{ steps.predispatch.outputs.at }}
