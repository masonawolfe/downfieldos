name: Data — Injuries

# Refreshes src/data/intelligence/injuries_${SEASON}.json from the nflverse
# `injuries` release. Feeds a "who's out this week" surface — the raw layer
# under whatever editorial roll-up we later build.

on:
  schedule:
    # Wed 12:00 UTC year-round; NFL injury reports drop Wed/Thu/Fri in-season
    - cron: '0 12 * * 3'
    - cron: '0 12 * * 5'   # Fri refresh to catch late-week designation changes
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to refresh (nflverse injuries_YYYY.csv)'
        required: false
        default: '2025'

permissions:
  contents: write

concurrency:
  group: data-injuries
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh injuries
        env:
          SEASON: ${{ github.event.inputs.season || '2025' }}
        run: npm run data:injuries
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "downfieldos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/intelligence/injuries_*.json
          if git diff --cached --quiet; then
            echo "No injury changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEASON="${{ github.event.inputs.season || '2025' }}"
          git commit -m "chore(data): refresh injuries_${SEASON}.json from nflverse

Auto-generated by .github/workflows/data-injuries.yml on schedule."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
