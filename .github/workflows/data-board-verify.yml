name: Data — Player Board Verify

# Standalone acceptance gate that runs the same verifier the board build
# runs inline. This one exists to catch drift between builds — e.g.,
# availability rebuilds but the board isn't recomputed, so
# `availability_last_verified_utc < 24h` drifts past its threshold and no
# one notices.
#
# Runs twice-daily and after every data-board run. Never commits, never
# deploys. Its only job is to fail loudly (red X) when the board has gone
# stale so the failure shows up in the Actions log.

on:
  schedule:
    # E-030 2026-09-17: once daily at 06:29 UTC — a fallback after the
    # overnight cadence (avail 04:04, board 04:34, v2 feeds 04:41–06:23)
    # settles. Primary trigger is still workflow_run on board completion.
    - cron: '29 6 * * *'
  workflow_run:
    workflows: ["Data — Player Board"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: data-board-verify
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Q-027 (2026-09-18): check #9 (row count vs previous committed
          # board) needs the parent commit to compare against. The build
          # workflow runs the verifier before the commit, so its HEAD is
          # already the "previous" board and depth=1 is fine. This verify
          # workflow runs AFTER the board push, so HEAD is the new board
          # and the check would compare it to itself — always Δ0, silently
          # passing every drift. Need depth=2 so `HEAD~1:board` resolves.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify the player board against its parent commit (all acceptance checks)
        # Q-027 (2026-09-18): point check #9 at the pre-push board via
        # HEAD~1 rather than the default HEAD, which would compare the
        # just-pushed board to itself. Exits non-zero if any check fails.
        env:
          PREV_BOARD_REF: HEAD~1
        run: npm run data:board:verify
