name: Data — Trades

# E-024 (2026-09-16): re-registered under the same path after GitHub's
# workflow-file parser stayed cached on the broken 2026-09-03 state and
# would not re-read the file on lighter changes. Adding an explicit
# `actions: read` permission below is the extra shape change that
# actually triggered re-parse for the 11-workflow batch. See E-015 /
# E-022 / E-024 in _TO_COS.md.

# Refreshes src/data/intelligence/trades.json from the nflverse `trades`
# release. Player + pick trades only — free-agent signings, waivers, and IR
# are NOT here (nflverse doesn't track them).

on:
  schedule:
    # Daily 12:00 UTC — trade activity spikes in bursts at the deadline / cut
    # weekends / draft. Cheap fetch (< 1 MB).
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: data-trades
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh trades
        run: npm run data:trades
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/intelligence/trades.json
          if git diff --cached --quiet; then
            echo "No trade changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh trades.json from nflverse

          Auto-generated by .github/workflows/data-trades.yml on schedule."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
