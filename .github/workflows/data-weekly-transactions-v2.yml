name: Data — Weekly Transactions (derived)

# E-026 (2026-09-16): invalid YAML since 2026-08-21, fixed in a74bd2e.
# `permissions: actions: write` below is for the deploy-dispatch step.

# Diffs the nflverse weekly_rosters snapshots week-over-week to derive
# signings, releases, team changes, and status changes. Fills the gap
# CoS finding #5 flagged (no FA/waiver/cut ingest exists).
#
# This is the "cheap and reliable" alternative to a PFR wire scraper:
# lower granularity (weekly, misses intra-week churn) but stable and
# derived from the same nflverse source everything else uses.

on:
  schedule:
    # Weekly Thu 12:30 UTC — nflverse publishes weekly rosters Wed evening.
    - cron: '53 5 * * 4'  # E-030 2026-09-17: overnight UTC (was `47 12`) — Thu refresh, off peak-hour backlog.
  workflow_dispatch:
    inputs:
      season:
        description: 'Season override (blank = derived)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.

concurrency:
  group: data-weekly-transactions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Derive weekly transactions
        env:
          SEASON: ${{ github.event.inputs.season }}
        run: npm run data:transactions-weekly
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/intelligence/weekly_transactions_*.json
          if git diff --cached --quiet; then
            echo "No weekly-transaction changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh weekly_transactions.json

          Auto-generated by .github/workflows/data-weekly-transactions.yml."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger prevents most
          # collisions, but a manual dispatch during a push-adjacent moment
          # still races. Up to 3 attempts, each fetches origin/main and
          # rebases with --autostash before retrying. --autostash is required
          # because most refresh scripts write auxiliary files (caches, logs,
          # snap counts) beyond what `git add` staged — the first proof pass
          # tripped on this.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
