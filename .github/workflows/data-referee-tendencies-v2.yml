name: Data — Referee Tendencies

# E-026 (2026-09-16): invalid YAML since 2026-08-21, fixed in a74bd2e.
# `permissions: actions: write` below is for the deploy-dispatch step.

# Computes per-referee penalty tendencies (penalties/game, DPI/game,
# home-team penalty share, deltas vs league baseline) by joining
# referee_appearances.json with nflverse PBP. Runs the PBP fetch itself
# because process_pbp.py's raw dir isn't persisted between workflow runs.
#
# CoS audit 2026-08-30 finding #6 — the raw appearance feed was the
# starting point; this workflow closes the gap the fetch-referees.js
# header called out.

on:
  schedule:
    # Weekly Fri 14:00 UTC — after data-referees (Thu) has refreshed
    # the appearance file for the week.
    - cron: '7 14 * * 5'  # E-029 2026-09-16: staggered minute (was `0`) so no two data workflows start together.
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Data — Referees"]
    types: [completed]

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.

concurrency:
  group: data-referee-tendencies
  cancel-in-progress: false

jobs:
  compute:
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch PBP for trailing seasons
        run: |
          set -euo pipefail
          mkdir -p ../data/intelligence/raw
          for yr in 2023 2024 2025; do
            url="https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${yr}.csv.gz"
            code=$(curl -sIL --max-time 30 "$url" -o /dev/null -w "%{http_code}")
            if [ "$code" = "200" ]; then
              curl -sL --max-time 300 "$url" -o "../data/intelligence/raw/play_by_play_${yr}.csv.gz"
              echo "  ✓ ${yr}"
            else
              echo "  ⚠ ${yr}: HTTP ${code} — skipping"
            fi
          done
      - name: Compute referee tendencies
        run: SEASONS=2023,2024,2025 npm run data:referee-tendencies
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/intelligence/referee_tendencies.json
          if git diff --cached --quiet; then
            echo "No referee-tendencies changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh referee_tendencies.json

          Auto-generated by .github/workflows/data-referee-tendencies.yml."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger prevents most
          # collisions, but a manual dispatch during a push-adjacent moment
          # still races. Up to 3 attempts, each fetches origin/main and
          # rebases with --autostash before retrying. --autostash is required
          # because most refresh scripts write auxiliary files (caches, logs,
          # snap counts) beyond what `git add` staged — the first proof pass
          # tripped on this.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
