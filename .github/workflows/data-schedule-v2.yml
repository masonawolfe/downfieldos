name: Data — Schedule

# E-026 (2026-09-16): invalid YAML since 2026-08-21, fixed in a74bd2e.
# `permissions: actions: write` below is for the deploy-dispatch step.

# Refreshes src/data/schedule${SEASON}.js from the nflverse `schedules` release.
# Bye weeks + playoff-week slate + roof/surface/stadium for the env model (P0-3
# and P2-1 in FANTASY_ENGINE_BUILD_PLAN.md).

on:
  schedule:
    # Weekly Mon 12:00 UTC — schedule changes are rare, but line/roof/surface
    # metadata drifts as gameweek approaches and this catches flex moves.
    - cron: '21 5 * * 1'  # E-030 2026-09-17: overnight UTC (was `27 12`) — Mon refresh, off peak-hour backlog.
  workflow_dispatch:
    inputs:
      season:
        description: 'NFL season to refresh'
        required: false
        default: '2026'

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.
  issues: write  # E-043 2026-09-19: needed by the watch-dispatched-deploy composite step to open/comment the outage issue.

concurrency:
  group: data-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh schedule
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: npm run data:schedule
      - name: Upstream drift gate (E-046)
        # E-046 (2026-09-21): after fetch-schedule.js has written the new
        # file, re-fetch nflverse games.csv and compare all 272 game_ids
        # both ways plus week / home / away / gameday / gametime /
        # weekday / stadium / roof / surface. Fail the build on any id
        # mismatch or any week/home/away change; allowlist LA→LAR
        # normalizations and the deliberate INTL roof/surface overrides.
        # Spread/total lines are excluded (they move between the
        # refresh and the compare fetch). Closes Q-034 — check #18
        # (delta-null vs previous commit) does not detect populated-
        # and-wrong rows, this one does.
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: npm run data:schedule:verify-upstream
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/schedule*.js
          if git diff --cached --quiet; then
            echo "No schedule changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEASON="${{ github.event.inputs.season || '2026' }}"
          git commit -m "chore(data): refresh schedule${SEASON}.js from nflverse

          Auto-generated by .github/workflows/data-schedule.yml on schedule."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger prevents most
          # collisions, but a manual dispatch during a push-adjacent moment
          # still races. Up to 3 attempts, each fetches origin/main and
          # rebases with --autostash before retrying. --autostash is required
          # because most refresh scripts write auxiliary files (caches, logs,
          # snap counts) beyond what `git add` staged — the first proof pass
          # tripped on this.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Record dispatch floor epoch (E-043b)
        if: steps.commit.outputs.changed == 'true'
        id: predispatch
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
      - name: Watch dispatched deploy + notify on non-success (E-043)
        if: steps.commit.outputs.changed == 'true'
        timeout-minutes: 25  # E-043b: keep the caller job from being pinned by a stuck deploy.
        uses: ./.github/actions/watch-dispatched-deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dispatched_after_epoch: ${{ steps.predispatch.outputs.at }}
