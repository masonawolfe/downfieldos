name: Data — Availability

# Refreshes src/data/intelligence/availability_2026.json from the Sleeper
# players API. Sleeper caches globally and refreshes multiple times a day;
# a daily pull is enough for draft-week + Week-1 use.
#
# Feeds the pre-draft board (data-board.yml) via workflow_run. The board's
# acceptance check #6 requires availability_last_verified_utc < 24h; a daily
# refresh keeps us inside that window.
#
# E-015 (2026-09-16): resurrected under a fresh filename after the 09-03
# registration cache made every push return "workflow file issue" ghost
# failures on the original data-availability.yml. Proven content-identical
# to the original; the difference is that the file was re-created after
# 09-03 (see 2026-09-16 commits in _TO_COS.md).

on:
  schedule:
    - cron: '4 4 * * *'  # E-030 2026-09-17: overnight UTC (was `0 11`) — 11:00 UTC never fired due to GHA peak-hour backlog. See _TO_COS 2026-09-17.
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write  # E-024: needed for the last `gh workflow run deploy.yml` step to trigger the site deploy
  issues: write  # E-043 2026-09-19: needed by the watch-dispatched-deploy composite step to open/comment the outage issue.

concurrency:
  group: data-availability
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch nflverse roster_weekly (needed for Sleeper→gsis join)
        # P0 2026-09-16: fetch-availability.js uses roster_weekly to map
        # Sleeper's sleeper_id to nflverse's gsis_id. Without this file the
        # map is empty and only ~90 players match instead of ~737 — and the
        # committed board loses every PUP/IR/SUSP row. Same fetch step
        # data-board.yml already uses; both scripts share the two-candidate
        # path probe (E-023), so fetching to <repo>/data/... satisfies both.
        run: |
          set -euo pipefail
          mkdir -p data/intelligence/raw
          curl -sSL --fail --max-time 120 \
            "https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_2026.csv.gz" \
            -o data/intelligence/raw/roster_weekly_2026.csv.gz
          echo "  roster_weekly_2026.csv.gz: $(wc -c < data/intelligence/raw/roster_weekly_2026.csv.gz) bytes"
      - name: Refresh availability
        run: npm run data:availability
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/intelligence/availability_2026.json
          if git diff --cached --quiet; then
            echo "No availability changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh availability_2026.json from Sleeper

          Auto-generated on schedule."
          # E-029 2026-09-16 (backfilled via Q-025 on 2026-09-18): availability
          # refreshes every 4h and its cron overlaps the board rebuild window;
          # a manual dispatch during a bot push still races. Up to 3 attempts,
          # each fetches origin/main and rebases with --autostash before
          # retrying. --autostash is required because Sleeper's fetch writes
          # cache files beyond what `git add` staged.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Record dispatch floor epoch (E-043b)
        if: steps.commit.outputs.changed == 'true'
        id: predispatch
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
      - name: Watch dispatched deploy + notify on non-success (E-043)
        if: steps.commit.outputs.changed == 'true'
        timeout-minutes: 25  # E-043b: keep the caller job from being pinned by a stuck deploy.
        uses: ./.github/actions/watch-dispatched-deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dispatched_after_epoch: ${{ steps.predispatch.outputs.at }}
