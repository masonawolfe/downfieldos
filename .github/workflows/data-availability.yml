name: Data — Availability

# Refreshes src/data/intelligence/availability_2026.json from the Sleeper
# players API. Sleeper caches globally and refreshes multiple times a day;
# a daily pull is enough for draft-week + Week-1 use.
#
# Feeds the pre-draft board (data-board.yml) via workflow_run. The board's
# acceptance check #6 requires availability_last_verified_utc < 24h; a daily
# refresh keeps us inside that window.

on:
  schedule:
    # Daily 11:00 UTC. Chained data-board.yml fires immediately after,
    # producing a rebuilt board within an hour of the refresh.
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-availability
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh availability
        run: npm run data:availability
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "downfieldos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/intelligence/availability_2026.json
          if git diff --cached --quiet; then
            echo "No availability changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh availability_2026.json from Sleeper

Auto-generated by .github/workflows/data-availability.yml on schedule."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
