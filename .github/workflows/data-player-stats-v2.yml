name: Data — Player Stats

# E-024 (2026-09-16): re-registered under the same path after GitHub's
# workflow-file parser stayed cached on the broken 2026-09-03 state and
# would not re-read the file on lighter changes. Adding an explicit
# `actions: read` permission below is the extra shape change that
# actually triggered re-parse for the 11-workflow batch. See E-015 /
# E-022 / E-024 in _TO_COS.md.

# Refreshes src/data/playerStats${SEASON}.js from the nflverse `stats_player`
# regular-season aggregate. The "developed" axis for P0-2 in
# FANTASY_ENGINE_BUILD_PLAN.md — YoY usage delta uses this feed.
#
# NOTE: 2026 stats do not exist until the season starts and nflverse publishes
# the first weekly aggregate. Default season = 2025 (last completed year).

on:
  schedule:
    # Weekly Wed 12:00 UTC year-round; nflverse rebuilds stats_player weekly
    # and the file is stable in offseason.
    - cron: '22 12 * * 3'  # E-029 2026-09-16: staggered minute (was `0`) so no two data workflows start together.
  workflow_dispatch:
    inputs:
      season:
        description: 'Completed season to aggregate (default 2025)'
        required: false
        default: '2025'

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.

concurrency:
  group: data-player-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh player stats
        env:
          SEASON: ${{ github.event.inputs.season || '2025' }}
        run: npm run data:stats
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/playerStats*.js
          if git diff --cached --quiet; then
            echo "No player-stats changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEASON="${{ github.event.inputs.season || '2025' }}"
          git commit -m "chore(data): refresh playerStats${SEASON}.js from nflverse

          Auto-generated by .github/workflows/data-player-stats.yml on schedule."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger (see `on.schedule`
          # above) prevents most collisions, but a manual dispatch during a
          # push-adjacent moment still races. Up to 3 attempts, each fetches
          # origin/main and rebases before retrying.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
