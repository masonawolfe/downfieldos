name: Data — Player Stats

# E-026 (2026-09-16): invalid YAML since 2026-08-21, fixed in a74bd2e.
# `permissions: actions: write` below is for the deploy-dispatch step.

# Refreshes src/data/playerStats${SEASON}.js from the nflverse `stats_player`
# regular-season aggregate. The "developed" axis for P0-2 in
# FANTASY_ENGINE_BUILD_PLAN.md — YoY usage delta uses this feed.
#
# NOTE: 2026 stats do not exist until the season starts and nflverse publishes
# the first weekly aggregate. Default season = 2025 (last completed year).

on:
  schedule:
    # Weekly Wed 12:00 UTC year-round; nflverse rebuilds stats_player weekly
    # and the file is stable in offseason.
    - cron: '13 5 * * 3'  # E-030 2026-09-17: overnight UTC (was `22 12`) — Wed refresh, off peak-hour backlog.
  workflow_dispatch:
    inputs:
      season:
        description: 'Completed season to aggregate (default 2025)'
        required: false
        default: '2025'

permissions:
  contents: write
  actions: write  # E-028 2026-09-16: needed for the final `gh workflow run deploy.yml` step to POST to /actions/workflows/*/dispatches; `read` returns 403.

concurrency:
  group: data-player-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh player stats
        env:
          SEASON: ${{ github.event.inputs.season || '2025' }}
        run: npm run data:stats
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/playerStats*.js
          if git diff --cached --quiet; then
            echo "No player-stats changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEASON="${{ github.event.inputs.season || '2025' }}"
          git commit -m "chore(data): refresh playerStats${SEASON}.js from nflverse

          Auto-generated by .github/workflows/data-player-stats.yml on schedule."
          # E-029 2026-09-16: retry-with-rebase. Cron stagger prevents most
          # collisions, but a manual dispatch during a push-adjacent moment
          # still races. Up to 3 attempts, each fetches origin/main and
          # rebases with --autostash before retrying. --autostash is required
          # because most refresh scripts write auxiliary files (caches, logs,
          # snap counts) beyond what `git add` staged — the first proof pass
          # tripped on this.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then echo "push failed after 3 attempts"; exit 1; fi
            echo "  push attempt $attempt lost race; fetching + rebasing"
            git fetch origin main
            git rebase --autostash origin/main || { git rebase --abort || true; echo "  rebase failed — aborting"; exit 1; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
