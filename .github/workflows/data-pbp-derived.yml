name: Data — PBP Derived (situational splits, scheme profiles)

# Runs the pandas-based process_pbp.py script that derives team scheme
# profiles, scheme similarity matrix, player usage data, and situational
# splits from the season's play-by-play CSV. Outputs land in
# src/data/intelligence/pbp/ for the app to consume.

on:
  schedule:
    # Weekly Tue 13:00 UTC — after the previous week's PBP CSV has been
    # rebuilt by nflverse (which happens on their Mon cadence).
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      year:
        description: 'PBP season to derive from'
        required: false
        default: '2025'

permissions:
  contents: write

concurrency:
  group: data-pbp-derived
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    env:
      PBP_YEAR: ${{ github.event.inputs.year || '2025' }}
      PBP_OUT_DIR: ${{ github.workspace }}/src/data/intelligence/pbp
      PBP_RAW_DIR: ${{ runner.temp }}/pbp-raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: pip install --upgrade pandas
      - name: Download nflverse PBP + roster
        run: |
          set -euo pipefail
          mkdir -p "$PBP_RAW_DIR" "$PBP_OUT_DIR"
          curl -sL --max-time 300 \
            "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${PBP_YEAR}.csv.gz" \
            -o "$PBP_RAW_DIR/play_by_play_${PBP_YEAR}.csv.gz"
          curl -sL --max-time 120 \
            "https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_${PBP_YEAR}.csv" \
            -o "$PBP_RAW_DIR/roster_weekly_${PBP_YEAR}.csv"
          ls -lh "$PBP_RAW_DIR"
      - name: Derive PBP intelligence
        run: python scripts/pbp/process_pbp.py --year "$PBP_YEAR"
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "downfieldos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/intelligence/pbp/
          if git diff --cached --quiet; then
            echo "No PBP-derived changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh PBP-derived intelligence (${PBP_YEAR})

Auto-generated by .github/workflows/data-pbp-derived.yml on schedule.
Includes team_scheme_profiles, scheme_similarity_matrix, player_usage_data,
situational_splits, and pbp_sync_metadata."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
